<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netscape Home</title>
    <style>
        body {
            background: linear-gradient(to bottom, #d6e4f0, #a0c4e8);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1a365d;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .welcome-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 { font-size: 18px; margin-bottom: 8px; color: #003366; }
        p { font-size: 12px; margin-bottom: 16px; color: #4a5568; }
        .quick-links { display: flex; flex-direction: column; gap: 8px; }
        .quick-btn {
            background: linear-gradient(to bottom, #ffffff, #e2ecf5);
            border: 1px solid #b8d0e8;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            font-weight: bold;
            color: #1e69de;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .quick-btn:hover { background: #d0e4ff; }
    </style>
</head>
<body>
    <div class="welcome-card">
        <h1>Netscape Navigator</h1>
        <p>Bienvenido a tu navegador con diseño Aero, pestañas Safari y soporte iOS.</p>
        <div class="quick-links">
            <a href="https://html.duckduckgo.com/html/" class="quick-btn">&#127760; DuckDuckGo Search</a>
            <a href="https://en.m.wikipedia.org" class="quick-btn">&#128214; Wikipedia Mobile</a>
            <a href="https://news.ycombinator.com" class="quick-btn">&#128240; Hacker News</a>
        </div>
    </div>
</body>
</html>
